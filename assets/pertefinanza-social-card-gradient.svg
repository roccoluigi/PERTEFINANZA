<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PERTEFINANZA</title>
  <desc id="desc">Marchio PERTEFINANZA su sfondo blu notte con gradiente diagonale</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c30"/>
    </linearGradient>
    <linearGradient id="diagonal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173d7a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="inner-diagonal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#93c5fd"/>
