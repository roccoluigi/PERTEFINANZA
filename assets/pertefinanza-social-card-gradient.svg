  <rect x="516" y="312" width="168" height="8" rx="4" fill="url(#inner-diagonal)"/>
  <text x="600" y="440" text-anchor="middle" fill="url(#brand-blue)" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="800">FINANZA</text>
</svg>